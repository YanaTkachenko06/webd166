<!doctype html>
<!-- Yana Tkachenko -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Trip Calculator</title>
</head>

<body>

    <h1>Calculate Your MPG and Cost of Trip</h1>

    <h2>Enter the information below to see if you are getting good mileage!</h2>

    <form action="calculator.php" method="post">

        <p>
            <label for="miles_driven">Miles Driven:</label>
            <input
                type="number"
                id="miles_driven"
                name="miles_driven"
                required>
        </p>

        <p>
            <label for="gallons_used">Gallons of Gas Used:</label>
            <input
                type="number"
                id="gallons_used"
                name="gallons_used"
                step="any"
                min="0.01"
                required>
        </p>

        <p>
            <label for="price_per_gallon">Price per gallon:</label>
            <input
                type="number"
                id="price_per_gallon"
                name="price_per_gallon"
                step="any"
                min="0"
                required>
        </p>

        <p>
            <input type="submit" value="Calculate the MPG and Cost of the Trip">
        </p>

        <p>
            <input type="reset" value="Clear Form">
        </p>

    </form>

</body>
</html>
